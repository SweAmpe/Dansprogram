<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dansprogram 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --border: #e2ddd6;
  --border2: #ccc8c0;
  --text: #1a1814;
  --muted: #6b6760;
  --hint: #9e9b96;
  --accent: #c8410a;
  --accent-bg: #fdf0eb;
  --fav: #e8a020;
  --fav-bg: #fdf5e6;
  --radius: 8px;
  --radius-lg: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
#wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
header { margin-bottom: 1.5rem; }
h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.3px; }
h1 span { color: var(--accent); }
.sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
.toolbar input, .toolbar select {
  height: 36px; font-size: 13px; font-family: inherit;
  border: 1px solid var(--border2); border-radius: var(--radius);
  padding: 0 10px; background: var(--surface); color: var(--text);
  outline: none;
}
.toolbar input { flex: 1; min-width: 160px; }
.toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
.btn {
  height: 36px; padding: 0 14px; font-size: 13px; font-family: inherit;
  border: 1px solid var(--border2); border-radius: var(--radius);
  background: var(--surface); color: var(--text);
  cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--bg); }
.btn.active { background: var(--fav-bg); border-color: var(--fav); color: #7a5010; }
.stats { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { position: sticky; top: 0; z-index: 1; }
th {
  text-align: left; padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  font-weight: 500; font-size: 11px; letter-spacing: 0.4px;
  text-transform: uppercase; color: var(--muted);
  background: var(--surface); white-space: nowrap; cursor: pointer; user-select: none;
}
th:hover { color: var(--text); }
td { padding: 7px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #faf9f7; }
.fav-btn {
  background: none; border: none; cursor: pointer;
  font-size: 16px; line-height: 1; padding: 2px 3px;
  color: var(--hint); transition: transform .12s, color .12s;
}
.fav-btn:hover { transform: scale(1.25); color: var(--fav); }
.fav-btn.on { color: var(--fav); }
.date-cell { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }
.time-cell { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--hint); white-space: nowrap; }
.band-cell { font-weight: 500; }
.band-cell.fav { color: var(--accent); }
.badge {
  display: inline-block; font-size: 10px; padding: 2px 7px;
  border-radius: 10px; background: var(--accent-bg);
  color: var(--accent); border: 1px solid #f0c4b0; white-space: nowrap;
}
.sep-row td {
  font-size: 11px; font-weight: 500; letter-spacing: 0.3px;
  color: var(--muted); background: #f2efe9;
  padding: 5px 12px; border-bottom: 1px solid var(--border);
  text-transform: uppercase;
}
.add-section {
  margin-top: 1.5rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1rem 1.25rem;
  background: var(--surface);
}
.add-section h3 { font-size: 13px; font-weight: 500; margin-bottom: 10px; color: var(--muted); }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.add-row input {
  height: 34px; font-size: 13px; font-family: inherit;
  border: 1px solid var(--border2); border-radius: var(--radius);
  padding: 0 9px; background: var(--bg); color: var(--text); outline: none;
}
.add-row input:focus { border-color: var(--accent); background: var(--surface); }
.add-row input::placeholder { color: var(--hint); }
.btn-add {
  height: 34px; padding: 0 16px; font-size: 13px; font-family: inherit;
  border: 1px solid var(--accent); border-radius: var(--radius);
  background: var(--accent); color: white; cursor: pointer; white-space: nowrap;
}
.btn-add:hover { background: #b03a08; }
.empty { text-align: center; padding: 3rem; color: var(--hint); font-size: 14px; }
.fav-count { display: inline-block; background: var(--fav-bg); color: #7a5010; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-left: 4px; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>Dans<span>program</span> 2026</h1>
    <p class="sub">Sök, filtrera och favoritmarkera dina band</p>
  </header>

  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍  Sök band, ort, ställe…" oninput="render()">
    <select id="lan-filter" onchange="render()">
      <option value="">Alla län</option>
    </select>
    <select id="dag-filter" onchange="render()">
      <option value="">Alla dagar</option>
      <option>Måndag</option><option>Tisdag</option><option>Onsdag</option>
      <option>Torsdag</option><option>Fredag</option><option>Lördag</option><option>Söndag</option>
    </select>
    <button class="btn" id="fav-toggle" onclick="toggleFavOnly()">
      ★ Bara favoriter <span class="fav-count" id="fav-count">0</span>
    </button>
    <button class="btn" id="pro-toggle" onclick="toggleHidePro()">
      ✕ Dölj PRO/SPF
    </button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:30px"></th>
          <th onclick="setSort('datum')">Datum</th>
          <th onclick="setSort('dag')">Dag</th>
          <th onclick="setSort('tid')">Tid</th>
          <th onclick="setSort('band')">Band</th>
          <th onclick="setSort('stalle')">Dansställe</th>
          <th onclick="setSort('ort')">Ort</th>
          <th onclick="setSort('lan')">Län</th>
          <th>Övrigt</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="add-section">
    <h3>+ Lägg till spelning</h3>
    <div class="add-row">
      <input id="a-datum" placeholder="Datum 2026-07-01" style="width:148px">
      <input id="a-tid" placeholder="Tid 19.00-23.00" style="width:128px">
      <input id="a-band" placeholder="Band *" style="width:130px">
      <input id="a-stalle" placeholder="Dansställe" style="width:150px">
      <input id="a-ort" placeholder="Ort" style="width:100px">
      <input id="a-kommun" placeholder="Kommun" style="width:100px">
      <input id="a-lan" placeholder="Län" style="width:100px">
      <input id="a-ovrigt" placeholder="Övrigt" style="width:90px">
      <button class="btn-add" onclick="addRow()">Lägg till</button>
    </div>
  </div>

  <div class="add-section" style="margin-top:1rem">
    <h3>⊘ Blockerade band — visas aldrig</h3>
    <div class="add-row" style="margin-bottom:10px">
      <input id="b-band" placeholder="Bandnamn att blockera" style="width:200px">
      <button class="btn-add" onclick="addBlock()">Blockera</button>
    </div>
    <div id="block-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px"></div>
  </div>
</div>

function loadStorage() {

  try { const v = localStorage.getItem('extraRows'); if(v) extraRows = JSON.parse(v); } catch(e){}
  try { const v = localStorage.getItem('blockedBands'); if(v) blockedBands = new Set(JSON.parse(v)); } catch(e){}
  try { const v = localStorage.getItem('hidePro'); if(v) hidePro = JSON.parse(v); } catch(e){}
}
function saveFavs() { try { localStorage.setItem('favBands', JSON.stringify([...favBands])); } catch(e){} }
function saveExtra() { try { localStorage.setItem('extraRows', JSON.stringify(extraRows)); } catch(e){} }
function saveBlocked() { try { localStorage.setItem('blockedBands', JSON.stringify([...blockedBands])); } catch(e){} }
function saveHidePro() { try { localStorage.setItem('hidePro', JSON.stringify(hidePro)); } catch(e){} }

function setSort(col) {
  sortAsc = sortCol === col ? !sortAsc : true;
  sortCol = col;
  render();
}
function toggleFavOnly() {
  favOnly = !favOnly;
  document.getElementById('fav-toggle').classList.toggle('active', favOnly);
  render();
}
function toggleFav(band) {
  if(favBands.has(band)) favBands.delete(band);
  else favBands.add(band);
  saveFavs();
  render();
}
function toggleHidePro() {
  hidePro = !hidePro;
  document.getElementById('pro-toggle').classList.toggle('active', hidePro);
  saveHidePro();
  render();
}
function addBlock() {
  const band = document.getElementById('b-band').value.trim();
  if(!band) return;
  blockedBands.add(band);
  saveBlocked();
  document.getElementById('b-band').value = '';
  renderBlockList();
  render();
}
function removeBlock(band) {
  blockedBands.delete(band);
  saveBlocked();
  renderBlockList();
  render();
}
function renderBlockList() {
  const el = document.getElementById('block-list');
  if(!el) return;
  if(!blockedBands.size) { el.innerHTML = '<span style="font-size:12px;color:var(--hint)">Inga blockerade band ännu.</span>'; return; }
  el.innerHTML = [...blockedBands].sort((a,b)=>a.localeCompare(b,'sv')).map(b =>
    `<span style="display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:3px 8px;font-size:12px">
      ${b} <button onclick="removeBlock('${b.replace(/'/g,"\'")}')" style="background:none;border:none;cursor:pointer;color:var(--hint);font-size:14px;line-height:1;padding:0 2px" title="Ta bort blockering">×</button>
    </span>`
  ).join('');
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const lan = document.getElementById('lan-filter').value;
  const dag = document.getElementById('dag-filter').value;
  const colMap = {datum:0,dag:1,tid:2,band:3,stalle:4,ort:5,kommun:6,lan:7};
  const ci = colMap[sortCol] ?? 0;
  let rows = [...allData];
  rows = rows.filter(r => !blockedBands.has(r[3]));
  if(hidePro) rows = rows.filter(r => !/(PRO|SPF)/i.test(r[8]));
  if(favOnly) rows = rows.filter(r => favBands.has(r[3]));
  if(q) rows = rows.filter(r => r.some(c => c.toLowerCase().includes(q)));
  if(lan) rows = rows.filter(r => r[7] === lan);
  if(dag) rows = rows.filter(r => r[1] === dag);
  rows.sort((a,b) => {
    const av = a[ci]||'', bv = b[ci]||'';
    return sortAsc ? av.localeCompare(bv,'sv') : bv.localeCompare(av,'sv');
  });
  return rows;
}

function render() {
  const rows = getFiltered();
  let html = '';
  let prevDate = '';
  rows.forEach(r => {
    const isFav = favBands.has(r[3]);
    if(r[0] !== prevDate && sortCol === 'datum') {
      html += `<tr class="sep-row"><td colspan="9">${r[0]} &mdash; ${r[1]}</td></tr>`;
      prevDate = r[0];
    }
    const bandEsc = r[3].replace(/'/g,"\\'").replace(/"/g,'&quot;');
    html += `<tr>
      <td><button class="fav-btn ${isFav?'on':''}" onclick="toggleFav('${bandEsc}')" title="${isFav?'Ta bort favorit':'Markera som favorit'}">★</button></td>
      <td class="date-cell">${r[0]}</td>
      <td>${r[1]}</td>
      <td class="time-cell">${r[2]}</td>
      <td class="band-cell ${isFav?'fav':''}">${r[3]}</td>
      <td>${r[4]}</td>
      <td>${r[5]}</td>
      <td>${r[7]}</td>
      <td>${r[8]?`<span class="badge">${r[8]}</span>`:''}</td>
    </tr>`;
  });
  if(!rows.length) html = '<tr><td colspan="9" class="empty">Inga spelningar matchar sökningen.</td></tr>';
  document.getElementById('tbody').innerHTML = html;
  document.getElementById('stats').textContent = `${rows.length} spelningar visas`;
  document.getElementById('fav-count').textContent = favBands.size;
}

function buildLanFilter() {
  const lans = [...new Set(allData.map(r=>r[7]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'sv'));
  const sel = document.getElementById('lan-filter');
  lans.forEach(l => { const o = document.createElement('option'); o.value=o.textContent=l; sel.appendChild(o); });
}

function addRow() {
  const datum = document.getElementById('a-datum').value.trim();
  const band = document.getElementById('a-band').value.trim();
  if(!datum || !band) { alert('Datum och band krävs.'); return; }
  const dagNames = ['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
  const d = new Date(datum+'T12:00:00');
  const dagName = dagNames[d.getDay()] || '';
  const row = [
    datum, dagName,
    document.getElementById('a-tid').value.trim(),
    band,
    document.getElementById('a-stalle').value.trim(),
    document.getElementById('a-ort').value.trim(),
    document.getElementById('a-kommun').value.trim(),
    document.getElementById('a-lan').value.trim(),
    document.getElementById('a-ovrigt').value.trim()
  ];
  extraRows.push(row);
  allData.push(row);
  saveExtra();
  ['a-datum','a-tid','a-band','a-stalle','a-ort','a-kommun','a-lan','a-ovrigt'].forEach(id => document.getElementById(id).value='');
  render();
}

loadStorage();
allData = [...JUNE_DATA, ...extraRows];
buildLanFilter();
renderBlockList();
if(hidePro) document.getElementById('pro-toggle').classList.add('active');
render();
</script>
</body>
</html>
